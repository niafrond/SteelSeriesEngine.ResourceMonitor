name: Publish binary

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SteelSeriesEngine.ResourceMonitor.sln

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build installer
        run: |
          powershell -ExecutionPolicy Bypass -File .\installer\build.ps1

      - name: Verify generated binary
        run: |
          if (!(Test-Path .\installer\app\SteelSeries.SysMonitor.exe)) {
            Write-Error "Generated binary not found: installer\\app\\SteelSeries.SysMonitor.exe"
            exit 1
          }

      - name: Resolve release tag
        id: release_tag
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'release') {
              core.setOutput('tag', context.payload.release.tag_name);
              return;
            }

            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            core.setOutput('tag', data.tag_name || '');

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelSeries-SysMonitor-binary
          path: installer/app/SteelSeries.SysMonitor.exe

      - name: Create GitHub release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: installer/app/SteelSeries.SysMonitor.exe
